    <rect x="192" y="390" width="132" height="5" rx="2.5" fill="#E8D6B8" opacity="0.45" stroke="none"/>
    <rect x="176" y="410" width="40" height="5" rx="2.5" fill="#C9B38A" opacity="0.8" stroke="none"/>
    <rect x="176" y="430" width="170" height="5" rx="2.5" fill="#E8D6B8" opacity="0.55" stroke="none"/>
    <rect x="192" y="446" width="96" height="5" rx="2.5" fill="#D9A7A7" opacity="0.7" stroke="none"/>
